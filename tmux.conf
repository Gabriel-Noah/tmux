# Mouse stuff
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g mouse on
set -g @scroll-in-moused-over-pane 'on'
set -g @scroll-speed-num-lines-per-scroll '1'

# Number stuff
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
bind-key s choose-tree -ZsK '#{?#{e|<:#{line},9},#{e|+:1,#{line}},#{?#{e|<:#{line},35},M-#{a:#{e|+:97,#{e|-:#{line},9}}},}}'  # makes it so the tmux session view count starts at 1

# Keybinding stuff
set -g prefix C-s
unbind r
bind r source-file ~/.config/tmux/tmux.conf
set -g escape-time 0  # Makes vim snappier

# Vim keybindings
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane switching without prefix
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Misc Fixes
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"  # Color support
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'  # Cursor support

# Makes splits open in same dir
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Status bar
set -g status-position top
set -g status-style bg=default,fg="#cdd6f4"
set -g status-left "██ "
set -g status-left-style "fg=#{?client_prefix,#fab387,green}"
set -g status-right "#[fg=black,bright]#S"
set -g message-style "bg=default,fg=#cdd6f4"

# Windows
set -g window-status-format " #I #W "
set -g window-status-current-format "\
#[fg=blue,bg=default]\
#[fg=#11111b,bg=blue]#I #W\
#[fg=blue,bg=default]#[default]"

# Panes
set -g pane-border-style fg=black
set -g pane-active-border-style fg=blue

# Plugins
set -g @plugin 'tmux-plugins/tpm'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
